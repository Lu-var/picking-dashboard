<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picking Stats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #60a5fa;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .card-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .big-stat {
            text-align: center;
            padding: 20px;
        }
        
        .big-stat .value {
            font-size: 48px;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 8px;
        }
        
        .big-stat .label {
            font-size: 14px;
            color: #94a3b8;
        }
        
        .order-list {
            list-style: none;
        }
        
        .order-item {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-info {
            flex: 1;
        }
        
        .order-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .order-details {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .order-speed {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
        }
        
        .trend {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        
        .trend-icon {
            font-size: 24px;
        }
        
        .trend-up {
            color: #10b981;
        }
        
        .trend-down {
            color: #ef4444;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #60a5fa;
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.5);
            z-index: 1000;
        }
        
        .refresh-btn:active {
            transform: scale(0.95);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        
        .spinner {
            border: 3px solid #334155;
            border-top: 3px solid #60a5fa;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Picking Stats</h1>
        <div class="subtitle" id="lastUpdate">Cargando...</div>
    </div>
    
    <!-- Today Stats -->
    <div class="card">
        <div class="card-title">📅 Hoy</div>
        <div id="todayStats" class="loading">
            <div class="spinner"></div>
            Cargando...
        </div>
    </div>
    
    <!-- Week Stats -->
    <div class="card">
        <div class="card-title">📈 Esta Semana</div>
        <div id="weekStats" class="loading">
            <div class="spinner"></div>
            Cargando...
        </div>
    </div>
    
    <!-- Performance Trend -->
    <div class="card">
        <div class="card-title">🎯 Progreso (Últimas 2 semanas)</div>
        <div id="trendStats" class="loading">
            <div class="spinner"></div>
            Cargando...
        </div>
    </div>
    
    <!-- Recent Orders -->
    <div class="card">
        <div class="card-title">📋 Últimos Pedidos</div>
        <ul id="recentOrders" class="order-list loading">
            <div class="spinner"></div>
            Cargando...
        </ul>
    </div>
    
    <button class="refresh-btn" onclick="loadAllData()">🔄</button>
    
    <script>
        function formatCurrency(value) {
            return '$' + value.toLocaleString('es-CL');
        }
        
        function formatTime(mins) {
            const hours = Math.floor(mins / 60);
            const minutes = mins % 60;
            return `${hours}:${minutes.toString().padStart(2, '0')}`;
        }
        
        async function loadTodayStats() {
            const response = await fetch('/api/today');
            const data = await response.json();
            
            const html = `
                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-value">${data.orders}</div>
                        <div class="stat-label">Pedidos</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.skus}</div>
                        <div class="stat-label">SKUs</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.speed}</div>
                        <div class="stat-label">SKUs/hr</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${formatCurrency(data.earned)}</div>
                        <div class="stat-label">Ganado</div>
                    </div>
                </div>
            `;
            
            document.getElementById('todayStats').innerHTML = html;
        }
        
        async function loadWeekStats() {
            const response = await fetch('/api/week');
            const data = await response.json();
            
            const html = `
                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-value">${data.orders}</div>
                        <div class="stat-label">Pedidos</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.skus}</div>
                        <div class="stat-label">SKUs</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.speed}</div>
                        <div class="stat-label">SKUs/hr</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${formatCurrency(data.earned)}</div>
                        <div class="stat-label">Ganado</div>
                    </div>
                </div>
            `;
            
            document.getElementById('weekStats').innerHTML = html;
        }
        
        async function loadTrendStats() {
            const response = await fetch('/api/stats');
            const data = await response.json();
            
            const isPositive = data.change_percent >= 0;
            const arrow = isPositive ? '📈' : '📉';
            const trendClass = isPositive ? 'trend-up' : 'trend-down';
            
            const html = `
                <div class="big-stat">
                    <div class="value">${data.recent_speed}</div>
                    <div class="label">SKUs/hr (Reciente)</div>
                    <div class="trend">
                        <span class="trend-icon">${arrow}</span>
                        <span class="${trendClass}" style="font-size: 20px; font-weight: bold;">
                            ${isPositive ? '+' : ''}${data.change_percent}%
                        </span>
                    </div>
                    <div style="margin-top: 12px; color: #64748b; font-size: 12px;">
                        vs. ${data.previous_speed} SKUs/hr (Anterior)
                    </div>
                </div>
            `;
            
            document.getElementById('trendStats').innerHTML = html;
        }
        
        async function loadRecentOrders() {
            const response = await fetch('/api/recent');
            const orders = await response.json();
            
            const html = orders.map(order => `
                <li class="order-item">
                    <div class="order-info">
                        <div class="order-name">${order.cliente}</div>
                        <div class="order-details">
                            ${order.fecha} • ${order.skus} SKUs • ${order.tiempo}
                        </div>
                    </div>
                    <div class="order-speed">${order.speed}</div>
                </li>
            `).join('');
            
            document.getElementById('recentOrders').innerHTML = html;
        }
        
        async function loadAllData() {
            document.getElementById('lastUpdate').textContent = 'Actualizando...';
            
            await Promise.all([
                loadTodayStats(),
                loadWeekStats(),
                loadTrendStats(),
                loadRecentOrders()
            ]);
            
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 
                `Última actualización: ${now.toLocaleTimeString('es-CL')}`;
        }
        
        // Load on page load
        loadAllData();
        
        // Auto-refresh every 2 minutes
        setInterval(loadAllData, 120000);
    </script>
</body>
</html>
